[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src self https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://dkhgaehodxugrwpdvbuk.supabase.co https://api.cabmy-maranatha.com https://site-cabmy.onrender.com https://cdnjs.cloudflare.com http://localhost:8001; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
